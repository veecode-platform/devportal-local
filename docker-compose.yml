name: devportal-local

# Image 3.0.0-beta.7 (chart-v0.1.21): bakes the product face
# (dynamic-plugins.veecode.yaml) + installer fail-closed/backstop. Since
# chart-v0.1.20 the operator config enters as dynamic-plugins.operator.yaml and
# merge-dynamic-plugins.js writes the level-1 dynamic-plugins.yaml the installer
# reads (via the image's baked symlink onto the data volume — EROFS fix).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rhdh
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rhdh}"
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhdh"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Docker creates named volumes as root-owned when their mount path is absent
  # from the image. The installer runs as UID 1001, so fix ownership first.
  fix-volume-ownership:
    # DevPortal 3.0.0-beta.7; pinned by digest for reproducible evaluation.
    image: docker.io/veecode/devportal@sha256:c443520aebf72df6978b00657a31f8e7af0924096dd53d73cf46d1db98405946
    user: "0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:0 /opt/app-root/src/dynamic-plugins-root /devportal-data"]
    volumes:
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - devportal-data:/devportal-data

  install-dynamic-plugins:
    # DevPortal 3.0.0-beta.7; pinned by digest for reproducible evaluation.
    image: docker.io/veecode/devportal@sha256:c443520aebf72df6978b00657a31f8e7af0924096dd53d73cf46d1db98405946
    depends_on:
      fix-volume-ownership:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        node regenerate-extensions-install.js
        --config app-config.yaml
        --config app-config.example.yaml
        --config app-config.example.production.yaml
        && node merge-dynamic-plugins.js
        && sh install-dynamic-plugins.sh /opt/app-root/src/dynamic-plugins-root
    environment:
      MAX_ENTRY_SIZE: "40000000"
      CATALOG_INDEX_IMAGE: quay.io/veecode/plugin-catalog-index:bs_1.52.0
      CATALOG_ENTITIES_EXTRACT_DIR: /devportal-data/catalog-entities-extract
      DEVPORTAL_DB_PATH: /devportal-data
      DEVPORTAL_FACE_FILE: /opt/app-root/src/dynamic-plugins.veecode.yaml
      DEVPORTAL_OPERATOR_CONFIG: /opt/app-root/src/dynamic-plugins.operator.yaml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rhdh
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rhdh}"
    volumes:
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - devportal-data:/devportal-data
      # Operator config, mounted OUTSIDE the installer's fixed dynamic-plugins.yaml
      # path — merge-dynamic-plugins.js merges it with the marketplace write-through
      # into the level-1 file the installer actually reads (same seam as the chart).
      - ./dynamic-plugins.yaml:/opt/app-root/src/dynamic-plugins.operator.yaml:ro

  devportal:
    # DevPortal 3.0.0-beta.7; pinned by digest for reproducible evaluation.
    image: docker.io/veecode/devportal@sha256:c443520aebf72df6978b00657a31f8e7af0924096dd53d73cf46d1db98405946
    depends_on:
      install-dynamic-plugins:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rhdh
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rhdh}"
      DEVPORTAL_DB_PATH: /devportal-data
    volumes:
      - dynamic-plugins-root:/opt/app-root/src/dynamic-plugins-root
      - devportal-data:/devportal-data
      - ./config/app-config.veecode-auth.yaml:/opt/app-root/src/app-config.veecode-auth.yaml:ro
      - ./config/app-config.veecode-branding.yaml:/opt/app-root/src/app-config.veecode-branding.yaml:ro
      - ./config/app-config.extensions.yaml:/opt/app-root/src/app-config.extensions.yaml:ro
      - ./config/app-config.veecode-product.yaml:/opt/app-root/src/app-config.veecode-product.yaml:ro
    # The image's own ENTRYPOINT remains active. Compose's command field is
    # only the Docker CMD/argument suffix, equivalent to the chart's `args`;
    # it appends the generated config and the three mounted fragments.
    command:
      - --config
      - dynamic-plugins-root/app-config.dynamic-plugins.yaml
      - --config
      - app-config.veecode-auth.yaml
      - --config
      - app-config.veecode-branding.yaml
      - --config
      - app-config.extensions.yaml
      # LAST on purpose: the product fragment overrides the earlier ones (theme,
      # branding width, Tech Radar URL, sidebar search, help/support). Same
      # ordering the chart uses in extraAppConfig.
      - --config
      - app-config.veecode-product.yaml
    ports:
      - "${DEVPORTAL_PORT:-7007}:7007"

volumes:
  dynamic-plugins-root:
  devportal-data:
  pgdata:
