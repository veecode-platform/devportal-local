# VeeCode default config — M4 branding fragment (app.title + app.branding).
#
# Target line: veecode/main (Backstage 1.52.0), post M3.5 re-anchor.
#
# Delivery: this is a raw app-config fragment (NOT a dynamic-plugins file).
# It only takes effect once something adds it to the backend's --config
# chain (e.g. `--config app-config.veecode-branding.yaml` alongside the
# base app-config.yaml) — wiring that into the quickstart harness / chart
# values is NOT done by this file; flagged in NOTES.md.
#
# Logo asset (fullLogo): the OFFICIAL VeeCode brand lockup, fetched from the
# canonical source https://veecode-platform.github.io/support/logos/logo.svg
# (repo veecode-platform/support, branch gh-pages) and inlined here as a
# base64 data URI. It is the full "Vee{C}ode Platform" wordmark — WHITE text
# with the teal {C} mark — i.e. it is designed for a DARK background (our
# sidebar and header both qualify; on a light surface the wordmark would
# disappear). Ratio ~3.3:1, hence fullLogoWidth below is no longer the 2.x
# square-mark value.
#
# Why a data URI and not a URL/file path: devportal-core ships NO VeeCode logo
# in packages/app/public/ (verified — only stock RHDH favicons/manifest), so a
# root-relative path like 2.x's `/veecode-logo.png` would 404 on this image,
# and baking an asset into the image would push a branding (data) concern into
# the image layer — exactly the 2.x mistake ADR-003 reverses. app.branding.*
# accepts a base64 data URI directly (packages/app/config.d.ts), which keeps
# the logo where it belongs: config.
#
# iconLogo stays the square teal {C} mark (base64 of
# devportal-platform/packages/app/public/veecode-logo.png, 152x145): it feeds
# the COLLAPSED sidebar icon and the runtime favicon, where a 3.3:1 lockup
# would be unreadable.
#
# app.title matches the 2.x preset (devportal-platform/presets/veecode-theme.yaml);
# fullLogoWidth is 180 (not 2.x's 150) because the asset changed shape: 150 was
# sized for the square {C} mark, this is the wide lockup.
app:
  title: "VeeCode DevPortal"
  branding:
    fullLogo: "data:image/svg+xml;base64,"
    iconLogo: "data:image/png;base64,"
    fullLogoWidth: 180
