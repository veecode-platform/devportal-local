# VeeCode default config — auth fragment (guest sign-in).
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  READ THIS BEFORE PUTTING A DEVPORTAL IN FRONT OF ANYONE ELSE.           │
# │                                                                          │
# │  This file turns on GUEST sign-in and maps the guest to the ADMIN        │
# │  identity. With it in the config chain, ANYONE who can reach the URL     │
# │  enters as an administrator, with no password.                           │
# │                                                                          │
# │  That is deliberate. It makes a fresh install usable in one step:        │
# │  you open it, you look around, you try the marketplace. It is NOT what   │
# │  you want the day the portal points at real integrations — a guest-admin │
# │  can then run scaffolder templates and install plugins, and RBAC         │
# │  enforcement is OFF until M6.                                            │
# │                                                                          │
# │  The chart delivers this fragment only when                              │
# │  global.veecode.guestAuth.enabled is true, which is off by default from  │
# │  chart 1.0.4. The local runner (devportal-local) puts it in its --config │
# │  chain. TO TURN IT OFF: set that value to false, or drop the fragment    │
# │  from the local runner's --config chain, and configure a real provider   │
# │  (GitLab/GitHub OAuth) instead. The image carries no auth decision.      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# WHY THIS LIVES IN CONFIG AND NOT IN THE IMAGE (ADR-003, amendment point 9):
# up to 3.0.0-alpha.5 this fragment was baked into the image and appended to
# the ENTRYPOINT's --config chain. That left it with no off switch: a
# container ENTRYPOINT is a fixed array, so making an argument conditional
# needs a shell wrapper in front of the process — which is exactly the 2.x
# "smart entrypoint" the three-layer split exists to reverse. Delivered as
# config, the lever is real: deliver the fragment or don't.
#
# PROVENANCE: byte-for-byte the 2.x posture (devportal-platform's
# app-config.yaml), not upstream RHDH's — the upstream baked chain sets
# `auth.environment: development` and ships NO providers at all.
# `dangerouslyAllowOutsideDevelopment` is required because the bundled backend
# runs with NODE_ENV unset, and the guest module refuses to mint tokens
# outside development without it (verified against this image, 2026-08-10).
auth:
  providers:
    guest:
      userEntityRef: user:default/admin
      ownershipEntityRefs: [group:default/admins]
      dangerouslyAllowOutsideDevelopment: true
